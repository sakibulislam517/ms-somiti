<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QIA Somiti - Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item.active { background: linear-gradient(90deg, #1e40af, #3b82f6); color: white; }
        .sidebar-item:hover:not(.active) { background-color: #f3f4f6; }
        .card-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .data-table th { background-color: #f8fafc; }
        .data-table tr:hover { background-color: #f1f5f9; }
        #sidebar { transition: transform 0.3s ease; }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Mobile Header -->
    <div class="md:hidden fixed top-0 left-0 right-0 bg-white shadow-sm z-50 px-4 py-3 flex items-center justify-between">
        <button id="menuBtn" class="text-gray-600 text-xl">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="text-lg font-bold text-blue-800">QIA Somiti</h1>
        <div class="w-8"></div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-xl z-40 overflow-y-auto">
        <div class="p-6 border-b">
            <h1 class="text-2xl font-bold text-blue-800"><i class="fas fa-building-columns mr-2"></i>QIA Somiti</h1>
            <p class="text-sm text-gray-500 mt-1">Management System</p>
        </div>
        <nav class="p-4 space-y-1">
            <a href="#" class="sidebar-item active flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all" data-page="dashboard">
                <i class="fas fa-chart-pie w-5 mr-3"></i>Dashboard
            </a>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="members">
                <i class="fas fa-users w-5 mr-3"></i>Member List
            </a>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="collection">
                <i class="fas fa-hand-holding-dollar w-5 mr-3"></i>Collection Payment
            </a>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="ledger">
                <i class="fas fa-book-open w-5 mr-3"></i>Investor Ledger
            </a>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="investment">
                <i class="fas fa-chart-pie w-5 mr-3"></i>Investments
            </a>
            <div class="pt-2 pb-1">
                <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Legacy Demo</p>
            </div>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="partners">
                <i class="fas fa-users w-5 mr-3"></i>Partner List
            </a>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="payments">
                <i class="fas fa-money-bill-transfer w-5 mr-3"></i>Payment Details
            </a>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="loans">
                <i class="fas fa-hand-holding-dollar w-5 mr-3"></i>Loan Management
            </a>
            <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 transition-all" data-page="costs">
                <i class="fas fa-receipt w-5 mr-3"></i>Costs / খরচ
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen pt-14 md:pt-0">
        <div id="content" class="p-6">
            <!-- Content loads here -->
        </div>
    </main>

    <!-- Overlay for mobile -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

    <script>
        $(document).ready(function() {
            // Load dashboard by default
            loadPage('dashboard');

            // Sidebar navigation
            $('.sidebar-item').click(function(e) {
                e.preventDefault();
                $('.sidebar-item').removeClass('active').addClass('text-gray-700');
                $(this).addClass('active').removeClass('text-gray-700');
                const page = $(this).data('page');
                loadPage(page);
                
                // Close mobile sidebar
                if ($(window).width() < 768) {
                    $('#sidebar').removeClass('open');
                    $('#overlay').addClass('hidden');
                }
            });

            // Mobile menu toggle
            $('#menuBtn').click(function() {
                $('#sidebar').toggleClass('open');
                $('#overlay').toggleClass('hidden');
            });

            $('#overlay').click(function() {
                $('#sidebar').removeClass('open');
                $('#overlay').addClass('hidden');
            });

            function loadPage(page) {
                $('#content').html('<div class="flex items-center justify-center h-64"><i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i></div>');
                $.get('pages/' + page + '.html', function(data) {
                    $('#content').html(data);
                    // Re-initialize any scripts
                    if (typeof initPage === 'function') initPage();
                }).fail(function() {
                    $('#content').html('<div class="text-center text-red-500 py-10"><i class="fas fa-exclamation-triangle text-4xl mb-4"></i><p>Page not found</p></div>');
                });
            }
        });
    </script>
</body>
</html>
