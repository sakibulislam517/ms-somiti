<div class="mb-8">

</div>

        <div>
            <label class="text-sm text-gray-500 block mb-1">Select Month</label>
            <select id="monthFilter" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="sep">September 2026</option>
                <option value="aug">August 2026</option>
                <option value="jul">July 2026</option>
                <option value="jun">June 2026</option>
                <option value="may">May 2026</option>
                <option value="apr">April 2026</option>
                <option value="mar">March 2026</option>
                <option value="feb">February 2026</option>
            </select>
        </div>
        <div>
            <label class="text-sm text-gray-500 block mb-1">Status Filter</label>

                <option value="on-time">On-time</option>
                <option value="accrued">Accrued</option>
                <option value="advance">Advance</option>
                <option value="due">Due</option>

            <p id="monthTotal" class="text-2xl font-bold text-green-600">৳2,30,000</p>
        </div>
    </div>
</div>

<!-- Payment Summary Cards -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl shadow-sm p-4">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mr-3">
                <i class="fas fa-check text-green-600"></i>
            </div>
            <div>
                <p class="text-sm text-gray-500">On-time</p>
                <p class="text-xl font-bold text-green-600" id="onTimeCount">22</p>
            </div>
        </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center mr-3">
                <i class="fas fa-clock text-red-600"></i>
            </div>
            <div>
                <p class="text-sm text-gray-500">Accrued</p>
                <p class="text-xl font-bold text-red-600" id="accruedCount">8</p>
            </div>
        </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                <i class="fas fa-arrow-up text-blue-600"></i>
            </div>
            <div>
                <p class="text-sm text-gray-500">Advance</p>
                <p class="text-xl font-bold text-blue-600" id="advanceCount">1</p>
            </div>
        </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center mr-3">
                <i class="fas fa-minus text-gray-600"></i>
            </div>
            <div>
                <p class="text-sm text-gray-500">Not Paid</p>
                <p class="text-xl font-bold text-gray-600" id="notPaidCount">5</p>
            </div>
        </div>
    </div>
</div>

<!-- Payment Table -->
<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm data-table">
            <thead>

                    <th class="text-left py-4 px-4 font-semibold text-gray-600">Name</th>
                    <th class="text-right py-4 px-4 font-semibold text-gray-600">Payment</th>

                    <th class="text-left py-4 px-4 font-semibold text-gray-600">Date</th>

    function renderPayments(month) {
        const data = paymentData[month] || [];
        let html = '';
        let total = 0;
        let onTime = 0, accrued = 0, advance = 0, notPaid = 0;

        data.forEach(function(p) {
            if (p.amount) total += p.amount;
            
            let statusClass = '';
            let statusText = '';
            switch(p.status) {
                case 'on-time':
                    statusClass = 'bg-green-100 text-green-700';
                    statusText = 'On-time';
                    onTime++;
                    break;
                case 'accrued':
                    statusClass = 'bg-red-100 text-red-700';
                    statusText = 'Accrued';
                    accrued++;
                    break;
                case 'advance':
                    statusClass = 'bg-blue-100 text-blue-700';
                    statusText = 'Advance';
                    advance++;
                    break;
                default:
                    statusClass = 'bg-gray-100 text-gray-700';
                    statusText = 'Due';
                    notPaid++;
            }

            html += `<tr class="border-b hover:bg-gray-50">
                <td class="py-3 px-4 text-xs text-gray-500">${p.id}</td>
                <td class="py-3 px-4 font-medium">${p.name}</td>
                <td class="py-3 px-4 text-right">${p.amount ? '৳' + p.amount.toLocaleString() : '-'}</td>
                <td class="py-3 px-4 text-center"><span class="px-2 py-1 rounded-full text-xs ${statusClass}">${statusText}</span></td>
                <td class="py-3 px-4 text-gray-500">${p.date}</td>
                <td class="py-3 px-4 text-xs text-gray-500">${p.ref}</td>
            </tr>`;

        $('#accruedCount').text(accrued);
        $('#advanceCount').text(advance);
        $('#notPaidCount').text(notPaid);
