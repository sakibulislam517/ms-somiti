<div class="mb-8 flex flex-wrap items-center justify-between gap-4">
    <div>
        <h2 class="text-2xl font-bold text-gray-800">Member List</h2>
        <p class="text-gray-500">All somiti members / investors and their current balances</p>
    </div>
    <button id="openMemberModal" class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">
        <i class="fas fa-plus"></i> Add Member
    </button>
</div>

<!-- Summary Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-green-600">
        <p class="text-sm text-gray-500">Total Collection</p>
        <p class="text-2xl font-bold text-gray-800" id="totalCollection">৳0</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-blue-600">
        <p class="text-sm text-gray-500">Invest Balance</p>
        <p class="text-2xl font-bold text-gray-800" id="totalInvestment">৳0</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-red-500">
        <p class="text-sm text-gray-500">Total Payment</p>
        <p class="text-2xl font-bold text-gray-800" id="totalPayment">৳0</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-purple-600">
        <p class="text-sm text-gray-500">Net Balance</p>
        <p class="text-2xl font-bold text-gray-800" id="netBalance">৳0</p>
    </div>
</div>

<!-- Member Table -->
<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm data-table">
            <thead>
                <tr class="border-b">
                    <th class="text-left py-4 px-4 font-semibold text-gray-600">SL</th>
                    <th class="text-left py-4 px-4 font-semibold text-gray-600">Name</th>
                    <th class="text-left py-4 px-4 font-semibold text-gray-600">Phone</th>
                    <th class="text-left py-4 px-4 font-semibold text-gray-600">Address</th>
                    <th class="text-right py-4 px-4 font-semibold text-gray-600">Collection</th>
                    <th class="text-right py-4 px-4 font-semibold text-gray-600">Investment</th>
                    <th class="text-right py-4 px-4 font-semibold text-gray-600">Payment</th>
                    <th class="text-right py-4 px-4 font-semibold text-gray-600">Balance</th>
                    <th class="text-center py-4 px-4 font-semibold text-gray-600">Action</th>
                </tr>
            </thead>
            <tbody id="memberTableBody">
                <tr><td colspan="9" class="py-10 text-center text-gray-400">Loading members...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Member Modal -->
<div id="memberModal" class="hidden fixed inset-0 z-50 bg-slate-950/50 p-4 flex items-center justify-center">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl">
        <div class="px-6 py-4 border-b flex items-center justify-between">
            <h3 id="memberModalTitle" class="text-lg font-bold text-gray-800">Add Member</h3>
            <button id="closeMemberModal" class="w-8 h-8 rounded-lg text-gray-500 hover:bg-gray-100"><i class="fas fa-xmark"></i></button>
        </div>
        <form id="memberForm" class="p-6 space-y-4">
            <input type="hidden" id="memberId" value="">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Full name</label>
                <input id="memberName" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Member name">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Phone</label>
                <input id="memberPhone" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="01XXXXXXXXX">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Address</label>
                <input id="memberAddress" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Full address">
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" id="cancelMemberModal" class="px-5 py-2.5 rounded-lg border border-gray-300 text-sm font-semibold text-gray-600 hover:bg-gray-50">Cancel</button>
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700"><i class="fas fa-check mr-2"></i>Save Member</button>
            </div>
        </form>
    </div>
</div>

<script>
$(document).ready(function() {
    const money = value => '৳' + Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    const memberApi = 'api/members.php';

    function loadMembers() {
        $.getJSON(memberApi + '?action=balances', function(response) {
            if (!response.ok) return;
            const rows = response.data;
            let html = '';
            let collectionTotal = 0, investTotal = 0, paymentTotal = 0, netTotal = 0;

            rows.forEach(function(m, i) {
                collectionTotal += m.collection_total;
                investTotal += m.invest_balance;
                paymentTotal += m.payment_total;
                netTotal += m.net_balance;
                const balanceClass = m.net_balance >= 0 ? 'text-green-600' : 'text-red-600';
                html += `<tr class="border-b hover:bg-gray-50">
                    <td class="py-3 px-4 text-gray-500">${i + 1}</td>
                    <td class="py-3 px-4 font-medium">${m.name}</td>
                    <td class="py-3 px-4 text-gray-500">${m.phone || '-'}</td>
                    <td class="py-3 px-4 text-gray-500">${m.address || '-'}</td>
                    <td class="py-3 px-4 text-right">${money(m.collection_total)}</td>
                    <td class="py-3 px-4 text-right text-blue-600">${money(m.invest_balance)}</td>
                    <td class="py-3 px-4 text-right">${money(m.payment_total)}</td>
                    <td class="py-3 px-4 text-right font-bold ${balanceClass}">${money(m.net_balance)}</td>
                    <td class="py-3 px-4 text-center whitespace-nowrap">
                        <button type="button" class="edit-member text-blue-600 hover:text-blue-800 mx-1" data-id="${m.id}" data-name="${m.name}" data-phone="${m.phone || ''}" data-address="${m.address || ''}" title="Edit"><i class="fas fa-pen"></i></button>
                        <button type="button" class="delete-member text-red-500 hover:text-red-700 mx-1" data-id="${m.id}" title="Remove"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });

            $('#memberTableBody').html(html || '<tr><td colspan="9" class="py-10 text-center text-gray-400">No members yet.</td></tr>');
            $('#totalCollection').text(money(collectionTotal));
            $('#totalInvestment').text(money(investTotal));
            $('#totalPayment').text(money(paymentTotal));
            $('#netBalance').text(money(netTotal));
        }).fail(function() {
            $('#memberTableBody').html('<tr><td colspan="9" class="py-10 text-center text-red-500">Could not load members.</td></tr>');
        });
    }

    function openModal(member) {
        $('#memberModalTitle').text(member ? 'Edit Member' : 'Add Member');
        $('#memberId').val(member ? member.id : '');
        $('#memberName').val(member ? member.name : '');
        $('#memberPhone').val(member ? member.phone : '');
        $('#memberAddress').val(member ? member.address : '');
        $('#memberModal').removeClass('hidden');
    }

    function closeModal() {
        $('#memberModal').addClass('hidden');
    }

    $('#openMemberModal').click(function() { openModal(null); });
    $('#closeMemberModal, #cancelMemberModal').click(closeModal);
    $('#memberModal').on('click', function(e) { if (e.target === this) closeModal(); });

    $(document).on('click', '.edit-member', function() {
        openModal({
            id: $(this).data('id'),
            name: $(this).data('name'),
            phone: $(this).data('phone'),
            address: $(this).data('address')
        });
    });

    $(document).on('click', '.delete-member', function() {
        const id = $(this).data('id');
        if (!confirm('Remove this member? Their ledger history stays intact.')) return;
        $.post(memberApi, { action: 'delete', id: id }, function(response) {
            alert(response.message || 'Member removed.');
            loadMembers();
        }, 'json');
    });

    $('#memberForm').on('submit', function(e) {
        e.preventDefault();
        const data = {
            action: 'save',
            id: $('#memberId').val(),
            name: $('#memberName').val(),
            phone: $('#memberPhone').val(),
            address: $('#memberAddress').val()
        };
        $.post(memberApi, data, function(response) {
            if (!response.ok) { alert(response.message || 'Save failed.'); return; }
            closeModal();
            loadMembers();
            alert(response.message);
        }, 'json');
    });

    loadMembers();
});
</script>
